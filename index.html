<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crafty Hub Store</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="apple-touch-icon" href="Crafty Hub/Favi_crafty hub.png">
</head>
<body>

<header class="nav"> 
  <div class="nav-brand">
  <a href="/" class="brand-link">
    <img src="Crafty Hub/FullLogo_Transparent_NoBuffer.png" alt="Crafty Hub Logo">
  </a>
  </div>
  <nav class="nav-links">
    <a href="#" id="nav-store">Crafty Hub Store</a>
    <a href="https://www.craftifye.com" target="_blank">3D Layers of Fun</a>
    <a href="#" id="nav-contact">Contact</a>
  </nav>
</header>

<section id="landing" class="landing">
  <h2>Choose Your Game</h2>
  <div class="tcg-grid">
    <button data-tcg="MTG">🧙 Magic: The Gathering</button>
    <button data-tcg="Pokemon">⚡ Pokémon</button>
    <button data-tcg="One Piece">🏴‍☠️ One Piece</button>
    <button data-tcg="Yu-Gi-Oh">🐉 Yu-Gi-Oh</button>
    <button data-tcg="all">🃏 View All Cards</button>
  </div>
</section>

<section class="toolbar">
  <input id="search" placeholder="Search cards" />
  <select id="filter">
    <option value="all">All Games</option>
    <option value="MTG">MTG</option>
    <option value="Pokemon">Pokémon</option>
    <option value="One Piece">One Piece</option>
    <option value="Yu-Gi-Oh">Yu-Gi-Oh</option>
  </select>
</section>

<main id="cards" class="cards"></main>

<button id="cartBtn" class="cart-fab">🛒 0</button>

<div id="contact-panel" class="contact-panel">
  <div class="contact-box">
    <h3>Contact Craftifye</h3>
    <a href="https://wa.me/966566173384" class="contact-btn">💬 WhatsApp</a>
    <a href="mailto:info@craftifye.com" class="contact-btn ghost">✉️ Email</a>
    <button id="close-contact" class="close-btn">Close</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
