<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crafty Hub Store</title>

  <link rel="icon" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="nav"> 
  <div class="nav-brand">
  <a href="/" class="brand-link">
    <img src="assets/logo.png" alt="Crafty Hub Logo">
  </a>
  </div>
  <nav class="nav-links">
    <a href="#" id="nav-store">Crafty Hub Store</a>
    <a href="https://www.craftifye.com" target="_blank">3D Layers of Fun</a>
    <a href="#" id="nav-contact">Contact</a>
  </nav>
</header>

<section id="landing" class="landing">
  <h2>Shop by Game</h2>

  <div class="tcg-cards">
    <div class="tcg-card" data-tcg="MTG">
      <img src="https://images.scryfall.com/cards/art_crop/front/0/0/00000000.jpg" alt="MTG">
      <h3>Magic: The Gathering</h3>
      <button>View Cards</button>
    </div>

    <div class="tcg-card" data-tcg="Pokemon">
      <img src="https://assets.pokemon.com/assets/cms2/img/trading-card-game/_tiles/strategy.jpg" alt="Pokemon">
      <h3>Pokémon</h3>
      <button>View Cards</button>
    </div>

    <div class="tcg-card" data-tcg="One Piece">
      <img src="https://en.onepiece-cardgame.com/images/cardlist/card/OP01-001.png" alt="One Piece">
      <h3>One Piece</h3>
      <button>View Cards</button>
    </div>

    <div class="tcg-card" data-tcg="Yu-Gi-Oh">
      <img src="https://images.ygoprodeck.com/images/cards/46986414.jpg" alt="YuGiOh">
      <h3>Yu-Gi-Oh</h3>
      <button>View Cards</button>
    </div>

    <div class="tcg-card all" data-tcg="all">
      <h3>All Games</h3>
      <button>View All Cards</button>
    </div>
  </div>
</section>


<section class="toolbar">
  <input id="search" placeholder="Search cards" />
  <select id="filter">
    <option value="all">All Games</option>
    <option value="MTG">MTG</option>
    <option value="Pokemon">Pokémon</option>
    <option value="One Piece">One Piece</option>
    <option value="Yu-Gi-Oh">Yu-Gi-Oh</option>
  </select>
</section>

<main id="cards" class="cards"></main>

<button id="cartBtn" class="cart-fab">🛒 0</button>

<div id="contact-panel" class="contact-panel">
  <div class="contact-box">
    <h3>Contact Craftifye</h3>
    <a href="https://wa.me/966566173384" class="contact-btn">💬 WhatsApp</a>
    <a href="mailto:info@craftifye.com" class="contact-btn ghost">✉️ Email</a>
    <button id="close-contact" class="close-btn">Close</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
