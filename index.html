<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craftifye | Multi-TCG Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <h1>Craftifye</h1>
  <span>Multi-TCG Cards • Instant WhatsApp Checkout</span>
</header>

<div class="skeleton"></div>
<img src="..." onload="this.previousElementSibling.remove()">

<div class="controls">
  <input id="search" placeholder="Search cards...">
  <select id="tcgFilter">
    <option value="all">All Games</option>
    <option value="MTG">Magic: The Gathering</option>
    <option value="Pokemon">Pokémon</option>
    <option value="One Piece">One Piece</option>
    <option value="Yu-Gi-Oh">Yu-Gi-Oh</option>
  </select>
</div>

<div id="cards" class="grid">
  <div class="price-badge"></div>
</div>

<script src="app.js"></script>
</body>
</html>
